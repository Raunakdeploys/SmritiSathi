<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001833" />
      <stop offset="50%" stop-color="#002045" />
      <stop offset="100%" stop-color="#063568" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6321" />
      <stop offset="100%" stop-color="#FFA07A" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="1000" cy="150" r="300" fill="#FF6321" opacity="0.08" />
  <circle cx="200" cy="500" r="250" fill="#3b82f6" opacity="0.08" />
  
  <g transform="translate(100, 140)">
    <!-- Brand Emblem -->
    <rect width="90" height="90" rx="24" fill="url(#accent)" />
    <path d="M45 25 C37 17 25 21 25 33 C25 45 45 61 45 61 C45 61 65 45 65 33 C65 21 53 17 45 25 Z" fill="#FFFFFF" />
    
    <!-- App Title & Tagline -->
    <text x="115" y="60" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.5">SmritiSaathi</text>
    <text x="115" y="90" fill="#FFA07A" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600">स्मृति साथी · Cognitive Health &amp; Elder Safety Compass</text>

    <!-- Value Propositions -->
    <text x="0" y="200" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700">Adaptive Dementia Care, Reminiscence &amp; Safety</text>
    <text x="0" y="245" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400">Multi-Turn Gemini AI Companion · Geofence Wandering Alerts · Cognitive Brain Exercises</text>

    <!-- Key Pills -->
    <g transform="translate(0, 300)">
      <rect width="210" height="52" rx="26" fill="#1e293b" stroke="#334155" />
      <text x="105" y="33" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">🧠 Brain Exercises</text>

      <rect x="230" width="220" height="52" rx="26" fill="#1e293b" stroke="#334155" />
      <text x="340" y="33" fill="#4ade80" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">🛡️ GPS Safety Ring</text>

      <rect x="470" width="250" height="52" rx="26" fill="#1e293b" stroke="#334155" />
      <text x="595" y="33" fill="#f472b6" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">💖 Reminiscence Therapy</text>

      <rect x="740" width="220" height="52" rx="26" fill="#1e293b" stroke="#334155" />
      <text x="850" y="33" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">🌐 Real-Time Search</text>
